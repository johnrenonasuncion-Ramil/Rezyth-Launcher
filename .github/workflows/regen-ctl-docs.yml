name: regen-ctl-docs
# TEMPORARY (removed once the regenerated file lands): the working tree this was
# run from has no Rust toolchain, so a runner regenerates the horizon-ctl
# command reference its test pins to the command table
# (crates/horizon-client/src/bin/horizon-ctl/commands.rs). It commits the file
# and also carries it as an artifact.
on:
  push:
    paths: ['.regen-ctl-docs']
permissions:
  contents: write
jobs:
  regen:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Install the ALSA and udev headers the client links against
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: verify
      - name: Regenerate the reference
        run: |
          cargo run -p horizon-client-lib --bin horizon-ctl -- help --markdown > docs/horizon-ctl-commands.md
          git diff --stat docs/horizon-ctl-commands.md
      - name: Commit and push (best effort)
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/horizon-ctl-commands.md
          git diff --cached --quiet || git commit -m "Regenerate the horizon-ctl command reference"
          git push || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ctl-docs
          path: docs/horizon-ctl-commands.md
          if-no-files-found: error
