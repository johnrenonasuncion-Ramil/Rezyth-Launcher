name: lockfile-bootstrap
# TEMPORARY (its two files are removed once everything lands): the working tree
# this was written in has no Rust toolchain, so one runner resolves the
# lockfile, type-checks the touched crates, runs the render crate's tests and
# formats the sources (this fork had never been rustfmt'ed). The artifact
# carries the lockfile, the manifest and the formatting patch.
on:
  push:
    paths: ['.lockfile-bootstrap']
permissions:
  contents: read
jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Install the ALSA and udev headers the client links against
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev
      - name: Install Rust, rustfmt and clippy
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: verify
      - name: Resolve the lockfile
        run: |
          cargo fetch
          cargo metadata --format-version 1 > /dev/null
      - name: Type-check the render crate
        run: cargo clippy -p horizon-client-render --lib --bins --tests -- -D warnings
      - name: Type-check the game crate
        if: always()
        run: cargo clippy -p horizon-client --lib -- -D warnings
      - name: Run the render crate's tests
        if: always()
        run: cargo test -p horizon-client-render --lib
      - name: Format the sources
        if: always()
        run: |
          cargo fmt --all
          git diff > "$RUNNER_TEMP/fmt.patch"
          git status --short
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lockfile
          path: |
            Cargo.lock
            crates/horizon-client-render/Cargo.toml
            ${{ runner.temp }}/fmt.patch
          if-no-files-found: error
