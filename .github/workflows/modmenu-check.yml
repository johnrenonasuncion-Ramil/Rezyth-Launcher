name: modmenu-check
# TEMPORARY (its two files are removed once the port lands): the working tree
# this was written in has no Rust toolchain, so one runner type-checks the
# Mod Menu port, runs the gameplay tests and formats the sources. The artifact
# carries the formatting patch (`cargo fmt --all`'s diff); the logs carry the
# compile and test results.
on:
  push:
    paths: ['.modmenu-check']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Install the ALSA and udev headers the client links against
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev
      - name: Install Rust, rustfmt and clippy
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: verify
      - name: Resolve dependencies
        run: |
          cargo fetch
          cargo metadata --format-version 1 > /dev/null
      - name: Type-check the game and render crates
        id: clippy
        continue-on-error: true
        run: cargo clippy -p horizon-client -p horizon-client-render --lib --bins --tests -- -D warnings
      - name: Type-check the client library
        if: always()
        continue-on-error: true
        run: cargo clippy -p horizon-client-lib --lib --bins --tests -- -D warnings
      - name: The gameplay tests
        if: always()
        continue-on-error: true
        run: cargo test -p horizon-client --lib --bins --tests
      - name: The client library's tests
        if: always()
        continue-on-error: true
        run: cargo test -p horizon-client-lib --lib --bins --tests
      - name: Format the sources
        if: always()
        run: |
          cargo fmt --all
          git diff > "$RUNNER_TEMP/fmt.patch"
          git status --short | head -40
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: modmenu-fmt
          path: ${{ runner.temp }}/fmt.patch
          if-no-files-found: error
