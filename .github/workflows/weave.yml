name: weave
# The official registry native mods (horizon-rust/horizon-mods), verified
# against a pinned registry snapshot and woven into one engine library by
# packaging/android/native_build.sh, then built into an APK. Dispatch-only:
# it downloads third-party bundles and executes their build, so it never runs
# on a push. arm64-v8a only, as this repository's APK builds are.
on:
  # A change to the weave tooling or this file is a request to run it (the
  # dispatch trigger waits for this file on the default branch). The
  # sentinel file reruns the same set without a tooling change.
  push:
    branches: [feat/volt-harvest]
    paths:
      - '.github/workflows/weave.yml'
      - 'tools/native_mods/**'
      - '.weave-trigger'
  workflow_dispatch:
    inputs:
      weave_set:
        description: Registry mods to weave, one id per line (empty: the default set in this file)
        type: string
        default: ''
      raw_targets:
        description: Also try bundles pinned without a hook-API declaration (the compiler judges)
        type: boolean
        default: false
permissions:
  contents: read
env:
  # The registry snapshot every bundle is verified against: one commit of
  # horizon-rust/horizon-mods, fetched whole.
  REGISTRY_REV: 63daa89bcbdcb80282c29970d743d6d00918a6ce
  # Every probe-green registry mod, as id=file. The release tag is the file
  # name without .hnmod.
  DEFAULT_SET: |
    jei=jei-0.1.0.hnmod
    horizon_physics=horizon_physics-0.15.1.hnmod
    jade=jade-26.3.5.hnmod
    veinminer=veinminer-0.3.2.hnmod
    appleskin=appleskin-1.0.0.hnmod
    status_effect_hud=status_effect_hud-1.0.0.hnmod
    toggle_sprint=toggle_sprint-1.0.0.hnmod
    inventory_profiles=inventory_profiles-1.0.0.hnmod
    shulker_peek=shulker_peek-0.1.0.hnmod
    mousetricks=mousetricks-0.2.0.hnmod
    itemnew=itemnew-0.1.1.hnmod
    eatinganimation=eatinganimation-0.1.0.hnmod
    enchantmenthints=enchantmenthints-0.1.0.hnmod
    light_overlay=light_overlay-1.0.0.hnmod
    right_click_crops=right_click_crops-1.0.0.hnmod
    smartf3=smartf3-0.1.0.hnmod
    armor_status=armor_status-1.0.0.hnmod
    crosshair_indicator=crosshair_indicator-1.0.0.hnmod
    hitbox_plus=hitbox_plus-1.3.0.hnmod
    invisible_frames=invisible_frames-0.1.1.hnmod
    freelook=freelook-0.3.1.hnmod
    voicechat=voicechat-1.0.0.hnmod
    worldedit=worldedit-1.2.1.hnmod
    horizonmatica=horizonmatica-0.1.1.hnmod
    visuality_horizon=visuality_horizon-1.0.2.hnmod
    held_item_info=held_item_info-0.1.0.hnmod
    carryblock=carryblock-0.1.2.hnmod
    chatheads=chatheads-0.1.0.hnmod
    fast_items=fast_items-0.1.0.hnmod
    customhud=customhud-1.6.0.hnmod
    coords_hud=coords_hud-2.0.0.hnmod
    biomecompass=biomecompass-0.2.2.hnmod
    skins_3d=skins_3d-1.1.0.hnmod
jobs:
  weave:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install the build-tools, platform and NDK native_build.sh pins
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "build-tools;35.0.0" "platforms;android-36" "ndk;28.2.13676358" > /dev/null
      - name: Install Rust for Android and cargo-ndk
        run: |
          rustup toolchain install stable --profile minimal --target aarch64-linux-android
          rustup default stable
          cargo install cargo-ndk --version 3.5.4 --locked
      - name: Install the bundle verifier's dependency
        run: python3 -m pip install cryptography
      - name: Fetch the pinned registry snapshot
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/registry"
          curl --retry 3 -fsSL "https://codeload.github.com/horizon-rust/horizon-mods/tar.gz/$REGISTRY_REV" \
            | tar -xz -C "$RUNNER_TEMP/registry" --strip-components=1
      - name: Download the bundles
        env:
          SET: ${{ inputs.weave_set }}
        run: |
          set -euo pipefail
          set_file="$RUNNER_TEMP/weave-set.txt"
          if [ -n "$SET" ]; then printf '%s\n' "$SET" > "$set_file"; else printf '%s\n' "$DEFAULT_SET" > "$set_file"; fi
          mkdir -p "$RUNNER_TEMP/bundle"
          args=()
          while IFS= read -r line; do
            [ -n "$line" ] || continue
            name="${line%%=*}"; file="${line#*=}"
            tag="${file%.hnmod}"
            curl --retry 3 -fsSL -o "$RUNNER_TEMP/bundle/$file" \
              "https://github.com/horizon-rust/horizon-mods/releases/download/$tag/$file"
            args+=(--mod "$name=$RUNNER_TEMP/bundle/$file")
          done < "$set_file"
          if [ "${{ inputs.raw_targets }}" = "true" ]; then args+=(--raw-targets); fi
          python3 tools/native_mods/weave.py \
            --registry "$RUNNER_TEMP/registry" \
            --registry-revision "$REGISTRY_REV" \
            "${args[@]}" \
            --output "$RUNNER_TEMP/weave" 2> "$RUNNER_TEMP/weave-report.txt" \
            > "$RUNNER_TEMP/weave-bundles.txt"
          echo "--- weave report:"; cat "$RUNNER_TEMP/weave-report.txt"
      - name: Build the APK with the woven set
        run: |
          set -euo pipefail
          mapfile -t bundles < "$RUNNER_TEMP/weave-bundles.txt"
          echo "woven bundles: ${bundles[*]}"
          PROFILE=quick bash packaging/android/native_build.sh . "$RUNNER_TEMP/woven" "${bundles[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: woven-apk
          path: |
            ${{ runner.temp }}/woven/starling-*.apk
            ${{ runner.temp }}/woven/build.json
          if-no-files-found: error
          retention-days: 30
      - name: The weave report on failure
        if: failure()
        run: cat "$RUNNER_TEMP/weave-report.txt" || true
