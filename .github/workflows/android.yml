name: android
# The Rezyth Launcher APK, on GitHub's runners: every push to the android branch and every pull request builds it and keeps
# it as an artifact, signed with the debug key in STARLING_DEBUG_KEYSTORE_BASE64 so one installs over another (a
# throwaway key where that secret is missing, as in a fork's pull request). A tag v* signs it with the release key held
# in the repository's secrets (STARLING_KEYSTORE_BASE64, STARLING_KEY_ALIAS, STARLING_STORE_PASSWORD, STARLING_KEY_PASSWORD)
# and publishes it as the latest release, with packaging/android/release-notes.md. The APK holds no game files: players
# prepare those from their own copy.
#
# This repository is Rezyth Launcher's own, so its builds are the app itself (android.horizon.ramil), signed
# with the repository's test key in STARLING_DEBUG_KEYSTORE_BASE64 (alias horizon-debug, password android); a
# tag here publishes nothing. The --dev and --preview variants of build_apk.py are for builds beside it.
on:
  push:
    branches: [android, starling, integration]
    tags: ['v*']
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      keep_symbols:
        description: Ship the library unstripped, for a profiler (simpleperf) to name its functions
        type: boolean
        default: false
      release_key:
        description: Build as a release does (release key, fast profile) without publishing, to install over a release; kept a day
        type: boolean
        default: false
      native_mods:
        description: A test with these native mods of native-mods/ compiled in (ids, separated by spaces), by native_build.sh
        type: string
        default: ''
permissions:
  contents: read
env:
  RELEASE_BUILD: ${{ (github.repository == 'JuanLuci/starling' && (startsWith(github.ref, 'refs/tags/v') || inputs.release_key)) && 'true' || 'false' }}
  # Rezyth Launcher is this repository's own app: the build is the app itself
  # (android.horizon.ramil), not a Preview beside someone else's release.
  PREVIEW: 'false'
concurrency:
  group: android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  apk:
    runs-on: ubuntu-latest
    # A release's fast profile builds slower (fewer codegen units, fewer at once: below).
    timeout-minutes: 150
    permissions:
      contents: write
      # A release asks native-mods.yml for its prebuilt native mod builds.
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # javac for the activities, and d8 and apksigner from the build-tools.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install the build-tools, platform and NDK build_apk.py pins
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "build-tools;35.0.0" "platforms;android-36" "ndk;28.2.13676358" > /dev/null
      - name: Install Rust for Android and cargo-ndk
        run: |
          rustup toolchain install stable --profile minimal --target aarch64-linux-android
          rustup default stable
          cargo install cargo-ndk --version 3.5.4 --locked
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: android
          save-if: ${{ github.ref == 'refs/heads/android' || github.ref == 'refs/heads/starling' }}
      - name: Unpack the release key
        if: env.RELEASE_BUILD == 'true'
        env:
          KEYSTORE: ${{ secrets.STARLING_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE" || { echo "STARLING_KEYSTORE_BASE64 is not set"; exit 1; }
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/rezyth-release.jks"
          echo "HORIZON_ANDROID_KEYSTORE=$RUNNER_TEMP/rezyth-release.jks" >> "$GITHUB_ENV"
      # The fast profile's 16 codegen units of the game's crate took more than the runner's 16 GB, and the runner
      # went: swap, on the large temporary disk where there is one, and three units at a time instead of four.
      - name: Make room for the release build
        if: env.RELEASE_BUILD == 'true'
        run: |
          sudo swapoff -a || true
          where=/mnt size=20G
          avail=$(df --output=avail -BG "$where" 2>/dev/null | tail -1 | tr -dc 0-9)
          if [ "${avail:-0}" -lt 30 ]; then where=$RUNNER_TEMP size=10G; fi
          sudo fallocate -l "$size" "$where/release.swap"
          sudo chmod 600 "$where/release.swap"
          sudo mkswap "$where/release.swap" > /dev/null
          sudo swapon "$where/release.swap"
          free -h
          echo "CARGO_BUILD_JOBS=3" >> "$GITHUB_ENV"
      # Where build_apk.py keeps its debug key (alias horizon-debug, password android).
      # Every build of this repository must sign with this one key: a different key on any run
      # makes the APK refuse to install over the last (INSTALL_FAILED_UPDATE_INCOMPATIBLE). A
      # fork's pull request has no secret and keeps the script's throwaway key.
      - name: Unpack the debug key
        if: env.RELEASE_BUILD != 'true'
        env:
          KEYSTORE: ${{ secrets.STARLING_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            if [ "${{ github.event_name }}" != "pull_request" ] && [ "${{ github.repository }}" = "johnrenonasuncion-Ramil/Rezyth-Launcher" ]; then
              echo "STARLING_DEBUG_KEYSTORE_BASE64 is not set: builds of this repository must share one signing key or their updates cannot install over a previous build."
              exit 1
            fi
            echo "::warning title=Signing key::STARLING_DEBUG_KEYSTORE_BASE64 is not set: this APK is signed with a throwaway key and will NOT install over a previous build."
            exit 0
          fi
          mkdir -p target/android
          echo "$KEYSTORE" | base64 -d > target/android/debug.keystore
          keytool -list -keystore target/android/debug.keystore -storepass android 2>/dev/null | grep -E 'horizon-debug|SHA256' || true
      - name: Build the APK
        env:
          HORIZON_ANDROID_KEY_ALIAS: ${{ env.RELEASE_BUILD == 'true' && secrets.STARLING_KEY_ALIAS || 'horizon-debug' }}
          HORIZON_ANDROID_STORE_PASSWORD: ${{ secrets.STARLING_STORE_PASSWORD }}
          HORIZON_ANDROID_KEY_PASSWORD: ${{ secrets.STARLING_KEY_PASSWORD }}
          MODS: ${{ inputs.native_mods }}
          PROFILE: ${{ env.RELEASE_BUILD == 'true' && 'fast' || 'quick' }}
          VARIANT: ${{ env.PREVIEW == 'true' && '--preview' || '' }}
        # Releases with the fast profile (fewer codegen units: a little quicker in game). With native mods, the APK
        # native_build.sh makes, named after them.
        run: |
          if [ -z "$MODS" ]; then
            python packaging/android/build_apk.py --profile "$PROFILE" $VARIANT ${{ inputs.keep_symbols && '--keep-symbols' || '' }}
            exit 0
          fi
          bundles=()
          for id in $MODS; do
            [[ "$id" =~ ^[a-z0-9][a-z0-9_-]*$ && -f "native-mods/$id/mixins/$id/horizon-mixin.toml" ]] || \
              { echo "$id is not a mod of native-mods/"; exit 1; }
            bundles+=("native-mods/$id/mixins/$id")
          done
          bash packaging/android/native_build.sh . "$RUNNER_TEMP/native" "${bundles[@]}"
          mkdir -p target/android
          for apk in "$RUNNER_TEMP"/native/rezyth-*.apk; do
            cp "$apk" "target/android/$(basename "${apk%.apk}")-$(echo $MODS | tr ' ' '-').apk"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: rezyth-apk
          path: target/android/rezyth-*.apk
          # A test build with the release key installs over a release: anyone may download a public
          # repository's artifacts, so it goes after a day.
          retention-days: ${{ inputs.release_key && 1 || 90 }}
      # The latest release is what the game's update prompt offers (game/update_offer.rs): the APK
      # it installs, Starling Visuals beside it, and the notes written for it.
      - name: Publish the release
        if: env.RELEASE_BUILD == 'true' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" target/android/rezyth-*.apk \
            target/android/StarlingVisuals.zip \
            --title "Rezyth Launcher $GITHUB_REF_NAME" --notes-file packaging/android/release-notes.md \
            --latest
      # The release's game with the sets of native-mods/prebuilt.txt (a release made with this token
      # starts no other workflow by itself; a dispatch does).
      - name: Build its native mods
        if: env.RELEASE_BUILD == 'true' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run native-mods.yml -R "$GITHUB_REPOSITORY" --ref android -f version="${GITHUB_REF_NAME#v}"
